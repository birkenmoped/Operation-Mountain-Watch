name: One-shot Ground RESUPPLY merge readiness

on:
  push:
    branches:
      - agent/automatic-response-orchestration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-response-orchestration
          fetch-depth: 0

      - name: Finalize documentation and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize-ground-resupply-merge-readiness.py
          python3 tools/validate_documentation.py .
          python3 tools/validate_documentation.py --main .
          git diff --check
          rm .github/workflows/ground-resupply-merge-readiness.yml
          rm tools/finalize-ground-resupply-merge-readiness.py

      - name: Commit final merge-readiness state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mission/tests tools .github/workflows/ground-resupply-merge-readiness.yml
          git diff --cached --check
          git commit -m "Finalize Ground RESUPPLY merge readiness"
          git push origin HEAD:agent/automatic-response-orchestration

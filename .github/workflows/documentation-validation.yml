name: Documentation validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "mission/tests/**/README.md"
      - "tools/*.py"
      - ".github/workflows/documentation-validation.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "mission/tests/**/README.md"
      - "tools/*.py"
      - ".github/workflows/documentation-validation.yml"

permissions:
  contents: write

jobs:
  validate-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply pending legacy metadata migration
        id: migrate
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-documentation-authority-migration'
        shell: bash
        run: |
          python tools/apply_metadata_migration.py .
          if git diff --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "Complete legacy documentation metadata migration"
            git push origin "HEAD:${{ github.head_ref }}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate documentation metadata and links
        id: validate
        shell: bash
        run: |
          set +e
          python tools/validate_documentation.py . > documentation-validation.txt 2>&1
          result=$?
          cat documentation-validation.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-validation-report
          path: documentation-validation.txt
          if-no-files-found: error
      - name: Archive checked-out documentation
        if: always()
        shell: bash
        run: |
          tar --exclude=.git -czf documentation-snapshot.tar.gz \
            README.md docs tools .github/workflows/documentation-validation.yml \
            mission/tests/jalalabad-air-operations/README.md
      - name: Upload checked-out documentation snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-snapshot
          path: documentation-snapshot.tar.gz
          if-no-files-found: error
      - name: Fail on documentation validation errors
        if: steps.validate.outputs.exit_code != '0'
        run: exit 1

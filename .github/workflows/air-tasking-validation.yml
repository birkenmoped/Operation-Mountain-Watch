name: Air Tasking validation

on:
  pull_request:
    paths:
      - 'scripts/air-operations/OMW_AirTasking_AARBridge.lua'
      - 'scripts/air-operations/OMW_AirTasking_AARBootstrap.lua'
      - 'mission/tests/air-tasking-aar-vertical/**'
      - 'tools/build-air-tasking-aar-additive-test.ps1'
      - '.github/workflows/air-tasking-validation.yml'
  workflow_dispatch:

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Run Air Tasking bridge contract test
        working-directory: mission/tests/air-tasking-aar-vertical
        run: lua5.1 test_bridge.lua

      - name: Build additive Air Tasking test bundle
        shell: pwsh
        run: ./tools/build-air-tasking-aar-additive-test.ps1

      - name: Hash generated bundle
        run: sha256sum mission/tests/air-tasking-aar-vertical/dist/OMW_AirTasking_AAR_Vertical_Test.lua

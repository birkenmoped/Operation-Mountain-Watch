name: Sync PR33 with main

on:
  push:
    branches:
      - agent/complete-documentation-authority-migration
    paths:
      - .github/workflows/sync-pr33-with-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-documentation-authority-migration
          fetch-depth: 0

      - name: Merge main and reconcile documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains current main."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            unmerged="$(git diff --name-only --diff-filter=U)"
            allowed="docs/moose/PROJECT-CLASS-INDEX.md
docs/moose/README.md"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                docs/moose/PROJECT-CLASS-INDEX.md|docs/moose/README.md)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done <<< "$unmerged"
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge conflicts remain." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def set_frontmatter(path, values):
              text = read(path)
              lines = text.splitlines(keepends=True)
              if not lines or lines[0].strip() != '---':
                  raise RuntimeError(f'missing frontmatter: {path}')
              end = next(i for i in range(1, len(lines)) if lines[i].strip() == '---')
              top_level = {}
              for i in range(1, end):
                  line = lines[i]
                  if line.startswith((' ', '\t', '-')) or ':' not in line:
                      continue
                  top_level[line.split(':', 1)[0].strip()] = i
              additions = []
              for key, value in values.items():
                  rendered = f'{key}:\n' if value is None else f'{key}: {value}\n'
                  if key in top_level:
                      lines[top_level[key]] = rendered
                  else:
                      additions.append(rendered)
              if additions:
                  lines[end:end] = additions
              write(path, ''.join(lines))

          fog = 'docs/moose/FOG-OF-WAR-RECCE.md'
          if not (ROOT / fog).exists():
              raise RuntimeError('main Fog-of-War/RECCE document was not merged')
          set_frontmatter(fog, {
              'document_class': 'MOOSE_CAPABILITY_ASSESSMENT',
              'owning_policy': 'OMW-GOV-001',
              'source_branch': 'main',
              'source_commit': '40a6de25b36a821dd1cc37523620c82890ad3f3b',
              'validated_in_dcs': 'false',
          })

          path = 'docs/moose/README.md'
          text = read(path)
          entry = '- [`FOG-OF-WAR-RECCE.md`](FOG-OF-WAR-RECCE.md) – MOOSE-Develop-Fähigkeiten und Grenzen von INTEL, INTEL_DLINK, PLAYERRECCE, TARS, RECON, DETECTION, DESIGNATE und CHIEF;'
          if entry not in text:
              anchor = '- [`ISR-FAC-CAS-AAR.md`](ISR-FAC-CAS-AAR.md) – geplante ISR-, FAC-/JTAC-, CAS- und AAR-Kette.'
              if anchor not in text:
                  raise RuntimeError('MOOSE README insertion anchor missing')
              text = text.replace(anchor, anchor + '\n' + entry)
          write(path, text)

          path = 'docs/moose/PROJECT-CLASS-INDEX.md'
          text = read(path)
          rows = """| `INTEL` | `PLANNED` | primäres taktisches Lagebild; Sensorarten, räumliche Filter, Kontakt-/Clusterereignisse und kontrollierte HUMINT-Einspeisung; Laufzeitnachweis im gepinnten MOOSE-Stand fehlt |\n| `INTEL_DLINK` | `CANDIDATE` | Aggregation getrennter Luft-, Boden- und HUMINT-Netze; Cache, Deduplizierung und Performance offen |\n| `PLAYERRECCE` | `CANDIDATE` | spielergeführte Aufklärung, Zielberichte und OH-58D-Kiowa-Autolase; Modul- und Multiplayerprüfung offen |\n| `TARS` | `CANDIDATE` | verzögerte Foto-/IMINT-Aufklärung mit Rückkehr und Debrief; Verfügbarkeit und CampaignState-Integration offen |\n| `DETECTION_*` | `PLANNED`, eingeschränkt | nur für DESIGNATE oder nachgewiesene Spezialfälle; kein paralleles strategisches Lagebild neben INTEL |\n"""
          if '| `INTEL_DLINK` | `CANDIDATE` |' not in text:
              anchor = '| `CTLD`, `CSAR`, `AICSAR` | `PLANNED` / teilweise verwendet | separate Acceptance erforderlich |\n'
              if anchor not in text:
                  raise RuntimeError('Class index insertion anchor missing')
              text = text.replace(anchor, anchor + rows)

          section = """## 4. Fog-of-War- und RECCE-Grenzen\n\n- [`OMW-MOOSE-FOG-OF-WAR-RECCE`](FOG-OF-WAR-RECCE.md) ist die vollständige Fähigkeits- und Grenzenanalyse.\n- `AUFTRAG:NewRECON()` ist ein Bewegungs-/Missionsauftrag und registriert das eingesetzte Asset nicht automatisch als `INTEL`-Agent.\n- `INTEL:SetForgetTime()` ist im geprüften Develop-Stand als obsolet und nicht funktionsfähig dokumentiert.\n- Direkte Zonen- oder Datenbankscans dürfen das Fog-of-War-Modell nicht umgehen.\n- `CHIEF` bleibt für die aktuelle Produktionsarchitektur `NOT_USED`; eine spätere Neubewertung muss seine direkte Zonenlogik berücksichtigen.\n\n## 5. Nachweisregel\n"""
          if '## 4. Fog-of-War- und RECCE-Grenzen' not in text:
              if '## 4. Nachweisregel\n' not in text:
                  raise RuntimeError('Class index section anchor missing')
              text = text.replace('## 4. Nachweisregel\n', section)
          write(path, text)

          path = 'docs/moose/ISR-FAC-CAS-AAR.md'
          text = read(path)
          ref = '- [`OMW-MOOSE-FOG-OF-WAR-RECCE`](FOG-OF-WAR-RECCE.md)'
          if ref not in text:
              anchor = '- [`OMW-TARGETING-AFGHANISTAN-NSL`](../48-afghanistan-no-strike-list.md)'
              if anchor not in text:
                  raise RuntimeError('ISR reference anchor missing')
              text = text.replace(anchor, anchor + '\n' + ref)
          write(path, text)

          path = 'docs/README.md'
          text = read(path)
          matrix = '| Fog of War / RECCE | [`OMW-MOOSE-FOG-OF-WAR-RECCE`](moose/FOG-OF-WAR-RECCE.md) | `PLANNED` | MOOSE-Develop geprüft; Laufzeitvalidierung im gepinnten MOOSE-Stand ausstehend |'
          if matrix not in text:
              anchor = '| CampaignState/dynamische Kampagne | [`OMW-ARCH-CAMPAIGN-DYNAMIC-MISSION`](37-campaign-architecture-and-dynamic-mission-design.md) | `BINDING` | Dokumente 04–07, TM01/TM02-Reviews |'
              if anchor not in text:
                  raise RuntimeError('Documentation index matrix anchor missing')
              text = text.replace(anchor, anchor + '\n' + matrix)
          entry = '- [`FOG-OF-WAR-RECCE`](moose/FOG-OF-WAR-RECCE.md)'
          if entry not in text:
              anchor = '- [`ISR-FAC-CAS-AAR`](moose/ISR-FAC-CAS-AAR.md)'
              if anchor not in text:
                  raise RuntimeError('Documentation index MOOSE anchor missing')
              text = text.replace(anchor, anchor + '\n' + entry)
          write(path, text)

          path = 'docs/DOCUMENT-REGISTRY.md'
          text = read(path)
          row = '| `OMW-MOOSE-FOG-OF-WAR-RECCE` | `docs/moose/FOG-OF-WAR-RECCE.md` | `PLANNED`; MOOSE-Fähigkeits- und Grenzenanalyse |'
          if row not in text:
              anchor = '| `OMW-MOOSE-CLASS-INDEX` | `docs/moose/PROJECT-CLASS-INDEX.md` | `BINDING` |'
              if anchor not in text:
                  raise RuntimeError('Document registry anchor missing')
              text = text.replace(anchor, anchor + '\n' + row)
          write(path, text)
          PY

          git add docs/moose/FOG-OF-WAR-RECCE.md \
                  docs/moose/README.md \
                  docs/moose/PROJECT-CLASS-INDEX.md \
                  docs/moose/ISR-FAC-CAS-AAR.md \
                  docs/README.md \
                  docs/DOCUMENT-REGISTRY.md

          python tools/validate_documentation.py .

          git status --short
          git commit -m "Merge main and preserve Fog-of-War documentation"
          git push origin HEAD:agent/complete-documentation-authority-migration

name: One-shot documentation metadata reconciliation

on:
  push:
    branches:
      - agent/documentation-metadata-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply metadata migration
        run: python tools/one_shot_documentation_metadata_reconciliation.py

      - name: Validate documentation as main
        run: python tools/validate_documentation.py --main .

      - name: Commit reconciled documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mission/tests
          git commit -m "Reconcile documentation metadata provenance"
          git push origin HEAD:agent/documentation-metadata-reconciliation

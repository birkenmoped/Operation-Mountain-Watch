name: One-shot documentation provenance cleanup

on:
  push:
    branches:
      - agent/documentation-validation-main-cleanup

permissions:
  contents: write

jobs:
  normalize-pending-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/documentation-validation-main-cleanup
          fetch-depth: 0

      - name: Normalize inherited placeholders and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_commit = "998080da9a7a71dae7f713b9590dfeadb5ae93ba"
          paths = [
              "docs/11-bases-and-fobs.md",
              "docs/18-air-operations-implementation.md",
              "docs/evidence/2026-08-18-army-ground-july-2011-unit-reconciliation.md",
              "docs/ground/ARMY-GROUND-FOUNDATION-DOMAIN-CONTRACT.md",
              "docs/ground/ARMY-GROUND-KUNAR-OPERATIONAL-DOMAIN-RECONCILIATION.md",
              "docs/ground/ARMY-GROUND-RECONSTITUTION-ACCESS-CONTRACT.md",
              "docs/ground/ARMY-GROUND-RESOURCE-QUANTITY-AND-SETTLEMENT-BASELINE.md",
              "docs/ground/ARMY-GROUND-RESOURCE-READINESS-CONTRACT.md",
              "docs/ground/ARMY-GROUND-RETURN-SETTLEMENT-DECISION-PREPARATION.md",
              "docs/ground/ARMY-GROUND-ROLE-AND-PLATOON-BASELINE.md",
              "docs/ground/ARMY-GROUND-TEMPLATE-NAMING-AND-DCS-TYPE-MAPPING.md",
              "docs/ground/ARMY-GROUND-VEHICLE-BASELINE.md",
              "docs/ground/GROUND-EXECUTION-LAYER-CONCEPT.md",
              "docs/handoffs/2026-08-19-army-ground-foundation-current-state-and-next-chat-handoff.md",
              "docs/moose/GROUND-MATERIALIZATION-AND-ROUTING-SOURCE-REVIEW.md",
              "docs/moose/GROUND-OPERATIONS.md",
              "docs/moose/MISSION-DEMAND-RESUPPLY-CAS-SOURCE-REVIEW.md",
              "docs/moose/PROJECT-CLASS-INDEX.md",
              "docs/moose/VERIFIED-METHODS-GROUND-ACCEPTANCE-1.md",
              "docs/moose/VERIFIED-METHODS.md",
              "mission/tests/army-ground-foundation/ACCEPTANCE-1.md",
              "mission/tests/army-ground-foundation/ACCEPTANCE-2.md",
              "mission/tests/army-ground-foundation/ACCEPTANCE-9.md",
              "mission/tests/army-ground-foundation/TODO.md",
              "mission/tests/army-ground-foundation/results/2026-08-18-acceptance-1-runtime.md",
          ]

          old = "source_commit: PENDING_MERGE"
          new = f"source_commit: {source_commit}"
          changed = 0
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{raw}: expected exactly one inherited placeholder, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              changed += 1
          if changed != len(paths):
              raise SystemExit(f"expected {len(paths)} changes, got {changed}")
          print(f"normalized {changed} inherited source_commit placeholders")
          PY

          python3 tools/validate_documentation.py .
          python3 tools/validate_documentation.py --main .

          rm .github/workflows/documentation-pending-merge-cleanup.yml

      - name: Commit normalized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs mission/tests .github/workflows/documentation-pending-merge-cleanup.yml
          git diff --cached --check
          git commit -m "Resolve inherited documentation source provenance"
          git push origin HEAD:agent/documentation-validation-main-cleanup

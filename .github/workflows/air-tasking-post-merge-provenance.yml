name: Finalize Air Tasking provenance reconciliation

on:
  push:
    branches:
      - agent/air-tasking-post-merge-provenance

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/air-tasking-post-merge-provenance
          fetch-depth: 0

      - name: Correct historical wording and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          recon = Path("docs/air-tasking-plan-main-reconciliation.md")
          text = recon.read_text(encoding="utf-8")
          text = text.replace(
              "Gemäß `docs/DOCUMENT-METADATA-POLICY.md` ist `source_commit: 121edd572f596e9a156c6c9137e24f5c9fdc72cc` auf einem offenen PR-Branch zulässig.",
              "Gemäß `docs/DOCUMENT-METADATA-POLICY.md` ist `source_commit: PENDING_MERGE` auf einem offenen PR-Branch zulässig."
          )
          recon.write_text(text, encoding="utf-8")

          handoff = Path("docs/handoffs/2026-08-22-air-tasking-plan-main-reconciliation-handoff.md")
          text = handoff.read_text(encoding="utf-8")
          text = text.replace(
              "[POST-MERGE REQUIRED] replace all PR-local source_commit: 121edd572f596e9a156c6c9137e24f5c9fdc72cc values that land on main with valid full commit provenance",
              "[COMPLETE] replace all PR-local source_commit: PENDING_MERGE values that landed on main with valid full commit provenance"
          )
          text = text.replace(
              "[PENDING OWNER DECISION] authorize PR #117 Ready for Review",
              "[COMPLETE] owner authorized PR #117 Ready for Review; transition performed"
          )
          text = text.replace(
              "[PENDING OWNER DECISION] authorize PR #117 merge",
              "[COMPLETE] owner authorized PR #117 merge; PR merged as d1ef605c510917b2e69bfb96c109ad9ff8e26654"
          )
          text = text.replace(
              "[POST-MERGE REQUIRED] update SUBPROJECT-REGISTRY from open PR #117 to merged history if required by current registry policy",
              "[COMPLETE] update SUBPROJECT-REGISTRY from open PR #117 to merged history"
          )
          text = text.replace(
              "[POST-MERGE REQUIRED] update this handoff / reconciliation status or supersede it with a finalization record",
              "[COMPLETE] add explicit post-merge status to this handoff and reconciliation record"
          )
          handoff.write_text(text, encoding="utf-8")

          registry = Path("docs/SUBPROJECT-REGISTRY.md")
          text = registry.read_text(encoding="utf-8")
          text = text.replace(
              "| 10 | `feature/tm02-red-tree-fill` | PR 9 | TM02N Tree Fill | gleicher Network-Pfad |",
              "| 10 | `feature/tm02-red-tree-fill` | PR 9 | TM02N Tree Fill | gleicher RED-Pfad |"
          )
          registry.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/air-tasking-post-merge-provenance.yml
          git add docs/air-tasking-plan-main-reconciliation.md docs/handoffs/2026-08-22-air-tasking-plan-main-reconciliation-handoff.md docs/SUBPROJECT-REGISTRY.md
          git commit -m "Finalize PR 117 post-merge reconciliation"
          git push origin HEAD:agent/air-tasking-post-merge-provenance

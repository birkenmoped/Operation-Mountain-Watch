name: AWACS validation

on:
  pull_request:
    paths:
      - "scripts/air-operations/OMW_AWACS_*.lua"
      - "scripts/air-operations/OMW_AirOps_AWACS_Bootstrap.lua"
      - "mission/tests/awacs-external-lifecycle/**"
      - "tools/build-awacs-foundation.ps1"
      - "tools/build-awacs-final-lifecycle.ps1"
      - "tools/build-awacs-acceptance-2.ps1"
      - "tools/build-awacs-acceptance-3.ps1"
      - "tools/build-awacs-acceptance-4.ps1"
      - "tools/build-awacs-acceptance-5.ps1"
      - ".github/workflows/awacs-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-awacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -v
          luac5.1 -v

      - name: Lua 5.1 syntax
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p scripts/air-operations/OMW_AWACS_CampaignStateAdapter.lua
          luac5.1 -p scripts/air-operations/OMW_AWACS_Controller.lua
          luac5.1 -p scripts/air-operations/OMW_AWACS_Controller_FullLifecycle.lua
          luac5.1 -p scripts/air-operations/OMW_AWACS_Controller_FullLifecycle_V2.lua
          luac5.1 -p scripts/air-operations/OMW_AWACS_Controller_FullLifecycle_V3.lua
          luac5.1 -p scripts/air-operations/OMW_AirOps_AWACS_Bootstrap.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/src/02-awacs-flight-profile-acceptance.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/src/03-awacs-persistent-orbit-emission-acceptance.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/src/04-awacs-full-fuel-aar-acceptance.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/src/05-awacs-e3-performance-matrix.lua

      - name: Build AWACS foundation
        shell: pwsh
        run: ./tools/build-awacs-foundation.ps1

      - name: Build full-duration AWACS acceptance
        shell: pwsh
        run: ./tools/build-awacs-acceptance-2.ps1

      - name: Build persistent-orbit AWACS acceptance
        shell: pwsh
        run: ./tools/build-awacs-acceptance-3.ps1

      - name: Build fuel-driven AWACS acceptance
        shell: pwsh
        run: ./tools/build-awacs-acceptance-4.ps1

      - name: Build E-3 performance matrix acceptance
        shell: pwsh
        run: ./tools/build-awacs-acceptance-5.ps1

      - name: Generated bundle syntax
        shell: bash
        run: |
          set -euo pipefail
          luac5.1 -p mission/runtime/air-operations/OMW_AWACS_Foundation.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/dist/OMW_AWACS_Acceptance_2.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/dist/OMW_AWACS_Acceptance_3.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/dist/OMW_AWACS_Acceptance_4.lua
          luac5.1 -p mission/tests/awacs-external-lifecycle/dist/OMW_AWACS_Acceptance_5.lua

      - name: Verify no generated files became tracked changes
        shell: bash
        run: |
          git status --short

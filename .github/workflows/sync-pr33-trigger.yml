name: Finalize PR33 after main synchronization

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 33
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronized PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-documentation-authority-migration
          fetch-depth: 0

      - name: Finalize RECCE documentation and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def set_frontmatter(path: str, values: dict[str, str]) -> None:
              lines = read(path).splitlines(keepends=True)
              if not lines or lines[0].strip() != "---":
                  raise RuntimeError(f"missing frontmatter: {path}")
              end = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              indices: dict[str, int] = {}
              for i in range(1, end):
                  line = lines[i]
                  if line.startswith((" ", "\t", "-")) or ":" not in line:
                      continue
                  indices[line.split(":", 1)[0].strip()] = i
              additions: list[str] = []
              for key, value in values.items():
                  rendered = f"{key}: {value}\n"
                  if key in indices:
                      lines[indices[key]] = rendered
                  else:
                      additions.append(rendered)
              if additions:
                  lines[end:end] = additions
              write(path, "".join(lines))

          fog = "docs/moose/FOG-OF-WAR-RECCE.md"
          set_frontmatter(fog, {
              "document_class": "MOOSE_CAPABILITY_ASSESSMENT",
              "owning_policy": "OMW-GOV-001",
              "source_branch": "main",
              "source_commit": "40a6de25b36a821dd1cc37523620c82890ad3f3b",
              "validated_in_dcs": "false",
          })

          path = "docs/moose/ISR-FAC-CAS-AAR.md"
          text = read(path)
          reference = "- [`OMW-MOOSE-FOG-OF-WAR-RECCE`](FOG-OF-WAR-RECCE.md)"
          if reference not in text:
              anchor = "- [`OMW-TARGETING-AFGHANISTAN-NSL`](../48-afghanistan-no-strike-list.md)"
              if anchor not in text:
                  raise RuntimeError("ISR reference anchor missing")
              text = text.replace(anchor, anchor + "\n" + reference)
          write(path, text)

          path = "docs/README.md"
          text = read(path)
          matrix = "| Fog of War / RECCE | [`OMW-MOOSE-FOG-OF-WAR-RECCE`](moose/FOG-OF-WAR-RECCE.md) | `PLANNED` | MOOSE-Develop geprüft; Laufzeitvalidierung im gepinnten MOOSE-Stand ausstehend |"
          if matrix not in text:
              anchor = "| CampaignState/dynamische Kampagne | [`OMW-ARCH-CAMPAIGN-DYNAMIC-MISSION`](37-campaign-architecture-and-dynamic-mission-design.md) | `BINDING` | Dokumente 04–07, TM01/TM02-Reviews |"
              if anchor not in text:
                  raise RuntimeError("documentation matrix anchor missing")
              text = text.replace(anchor, anchor + "\n" + matrix)
          entry = "- [`FOG-OF-WAR-RECCE`](moose/FOG-OF-WAR-RECCE.md)"
          if entry not in text:
              anchor = "- [`ISR-FAC-CAS-AAR`](moose/ISR-FAC-CAS-AAR.md)"
              if anchor not in text:
                  raise RuntimeError("documentation MOOSE anchor missing")
              text = text.replace(anchor, anchor + "\n" + entry)
          write(path, text)

          path = "docs/DOCUMENT-REGISTRY.md"
          text = read(path)
          row = "| `OMW-MOOSE-FOG-OF-WAR-RECCE` | `docs/moose/FOG-OF-WAR-RECCE.md` | `PLANNED`; MOOSE-Fähigkeits- und Grenzenanalyse |"
          if row not in text:
              anchor = "| `OMW-MOOSE-CLASS-INDEX` | `docs/moose/PROJECT-CLASS-INDEX.md` | `BINDING` |"
              if anchor not in text:
                  raise RuntimeError("document registry anchor missing")
              text = text.replace(anchor, anchor + "\n" + row)
          write(path, text)

          Path(".github/workflows/sync-pr33-with-main.yml").unlink(missing_ok=True)
          Path(".github/workflows/sync-pr33-trigger.yml").unlink(missing_ok=True)
          PY

          python tools/validate_documentation.py .
          git add -A
          git status --short
          git commit -m "Finalize PR33 after main synchronization"
          git push origin HEAD:agent/complete-documentation-authority-migration

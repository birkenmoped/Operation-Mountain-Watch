name: UAV ISR request validation

on:
  push:
    paths:
      - "scripts/campaign/OMW_ISR_RequestCoordinator.lua"
      - "scripts/air-operations/OMW_ISR_RequestMenu.lua"
      - "scripts/air-operations/OMW_ISR_UavDispatcher.lua"
      - "scripts/air-operations/OMW_AirOps_Kandahar_Bootstrap.lua"
      - "scripts/campaign/OMW_ISR_UavCampaignStateAdapter.lua"
      - "scripts/campaign/OMW_CampaignState.lua"
      - "tests/uav-isr/**"
      - "mission/tests/uav-isr-request/**"
      - "tools/build-uav-isr-request-acceptance-1.ps1"
      - "tools/build-uav-isr-request-acceptance-2.ps1"
      - ".github/workflows/uav-isr-request-validation.yml"
  pull_request:
    paths:
      - "scripts/campaign/OMW_ISR_RequestCoordinator.lua"
      - "scripts/air-operations/OMW_ISR_RequestMenu.lua"
      - "scripts/air-operations/OMW_ISR_UavDispatcher.lua"
      - "scripts/air-operations/OMW_AirOps_Kandahar_Bootstrap.lua"
      - "scripts/campaign/OMW_ISR_UavCampaignStateAdapter.lua"
      - "scripts/campaign/OMW_CampaignState.lua"
      - "tests/uav-isr/**"
      - "mission/tests/uav-isr-request/**"
      - "tools/build-uav-isr-request-acceptance-1.ps1"
      - "tools/build-uav-isr-request-acceptance-2.ps1"
      - ".github/workflows/uav-isr-request-validation.yml"

permissions:
  contents: read

jobs:
  uav-isr-request-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.4
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          lua5.4 -v

      - name: Run UAV ISR request contracts
        shell: bash
        run: lua5.4 tests/uav-isr/run.lua

      - name: Build isolated UAV ISR Acceptance 1 bundle
        shell: pwsh
        run: ./tools/build-uav-isr-request-acceptance-1.ps1

      - name: Build isolated UAV ISR Acceptance 2 bundle
        shell: pwsh
        run: ./tools/build-uav-isr-request-acceptance-2.ps1

      - name: Verify Acceptance bundles were produced
        shell: bash
        run: |
          test -s mission/tests/uav-isr-request/dist/OMW_UAV_ISR_Request_Acceptance_1.lua
          test -s mission/tests/uav-isr-request/dist/OMW_UAV_ISR_Request_Acceptance_2.lua
